[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=../lib/forge-std/src/", "openzeppelin-contracts/=../lib/openzeppelin-contracts/"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true
