[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../lib"]
# Keep compiler metadata portable; only the explicit remappings below belong to this package.
auto_detect_remappings = false
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./config" }]
allow_paths = ["../src"]
remappings = ["solady/=../lib/Solady/src/", "capital/=../src/", "forge-std/=../lib/forge-std/src/", "openzeppelin-contracts/=../lib/openzeppelin-contracts/"]
[fuzz]
runs = 1000

[invariant]
runs = 1000
depth = 500
fail_on_revert = true
